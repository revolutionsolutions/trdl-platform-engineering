apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trdl-deployer
  namespace: trdl
rules:
  - apiGroups: ["", "apps"]
    resources:
      - deployments
      - pods
      - services
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trdl-deployer
  namespace: trdl
subjects:
  - kind: Group
    name: trdl-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: trdl-deployer
  apiGroup: rbac.authorization.k8s.io