apiVersion: v1
kind: Namespace
metadata:
  name: trdl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trdl
  namespace: trdl
  labels:
    app: trdl
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: trdl
  template:
    metadata:
      labels:
        app: trdl
    spec:
      containers:
        - name: trdl
          image: 891377010440.dkr.ecr.us-east-1.amazonaws.com/trdl
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trdl
  namespace: trdl
spec:
  type: ClusterIP
  selector:
    app: trdl
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
